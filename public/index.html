<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BottleNeck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f14; --panel:#0f141b; --row:#121821; --row-hover:#17202b; --line:#1e2733;
  --text:#e8edf2; --muted:#8a96a3; --dim:#5b6673;
  --green:#39FF14; --green-ink:#0b0f14; --blue:#3fb8ff; --purple:#9b7bff; --amber:#f5a524; --pink:#ff4f8b;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Lato",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0b0f14; --panel:#0f141b; --row:#121821; } }
:root[data-theme="dark"]{ --bg:#0b0f14; --panel:#0f141b; --row:#121821; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* header */
header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--bg)}
.logo{width:52px;height:46px;flex:none;object-fit:contain}
.title h1{margin:0;font:900 30px/1 var(--sans);letter-spacing:-.5px}
.title h1 .g{color:var(--green)}
.title p{margin:6px 0 0;font:400 11px var(--mono);color:#cfd6dd;display:flex;align-items:center;gap:8px}
.title p::before{content:"";width:6px;height:6px;border-radius:50%;background:#1f9d3a}
.tz{margin-left:auto;display:flex;align-items:center;gap:8px;padding:5px 12px;border:1.5px solid var(--green);border-radius:999px;background:transparent;font:500 11px var(--mono);color:var(--green);letter-spacing:.5px;cursor:pointer}
.tz.manila{border-color:var(--blue);color:var(--blue)}

/* section tabs */
nav.sections{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.sections button{background:none;border:0;border-bottom:2px solid transparent;padding:13px 16px;font:500 12px var(--mono);letter-spacing:1px;color:var(--muted);cursor:pointer;white-space:nowrap;text-transform:uppercase}
nav.sections button[aria-selected="true"]{color:var(--green);border-bottom-color:var(--green)}
nav.sections button .ct{margin-left:8px;color:var(--dim)}
nav.sections button[aria-selected="true"] .ct{color:var(--green);opacity:.7}

main{padding:0 16px 32px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:20px 0;border-bottom:1px solid var(--line)}
.pill{border:1px solid #2a3542;background:transparent;border-radius:999px;padding:7px 16px;font:500 11px var(--mono);letter-spacing:1px;cursor:pointer;text-transform:uppercase}
.pill.on{background:var(--green);border-color:var(--green);color:var(--green-ink);font-weight:700}
.pill:disabled{opacity:.35;cursor:default}
.spin{display:inline-block;width:8px;height:8px;border:1.5px solid var(--green);border-right-color:transparent;border-radius:50%;margin-right:8px;vertical-align:middle}
.spin.go{animation:r .7s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin.go{animation:none}}
.stamp{font:400 11px var(--mono);color:var(--dim);margin-left:auto}

/* filters */
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:20px 0}
.f label{display:block;font:700 10px var(--mono);letter-spacing:1px;text-transform:uppercase;margin-bottom:7px}
.f input,.f select{width:100%;background:var(--panel);border:1px solid #2a3542;border-radius:3px;padding:7px 9px;font:400 11px var(--mono);color:var(--text)}
.f input::placeholder{color:var(--dim)}
.f select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#aab 50%),linear-gradient(135deg,#aab 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;background-size:4px 4px;background-repeat:no-repeat;padding-right:24px}
.f.actions{display:flex;align-items:flex-end;gap:8px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border:1px solid var(--line);border-radius:4px}
.k{padding:14px 16px;border-right:1px solid var(--line);min-width:0}
.k:last-child{border-right:0}
.k .l{font:500 10px var(--mono);letter-spacing:1px;text-transform:uppercase;color:#cfd6dd}
.k .v{font:700 32px/1.15 var(--mono);margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k .s{font:400 11px var(--mono);color:#cfd6dd;margin-top:4px}
.k .v .b{color:var(--blue)} .k .v .p{color:var(--purple)} .k .v .dim{color:var(--dim)}
.k .v.small{font-size:18px;margin-top:16px}
@media (max-width:760px){.kpis{grid-template-columns:1fr 1fr}.k:nth-child(2){border-right:0}.k:nth-child(-n+2){border-bottom:1px solid var(--line)}}

/* table */
.tablewrap{overflow-x:auto;margin-top:0}
table{width:100%;border-collapse:separate;border-spacing:0 5px;min-width:1100px}
thead th{font:500 10px var(--mono);letter-spacing:.8px;text-transform:uppercase;color:#cfd6dd;text-align:left;padding:12px 10px 6px;white-space:nowrap;cursor:pointer;user-select:none}
thead th.nosort{cursor:default}
thead th .arr{color:var(--dim);margin-left:3px;font-size:9px}
thead th.sorted{color:var(--green)} thead th.sorted .arr{color:var(--green)}
tbody tr{background:var(--row)}
tbody tr:hover{background:var(--row-hover)}
tbody td{padding:13px 10px;white-space:nowrap;border-top:1px solid #161e28;border-bottom:1px solid #161e28}
tbody td:first-child{border-left:3px solid var(--st,#2a3542);border-radius:3px 0 0 3px}
tbody td:last-child{border-right:1px solid #161e28;border-radius:0 3px 3px 0}
td.link a{color:var(--blue);text-decoration:none;font-weight:700}
td.link a:hover{text-decoration:underline}
td.num{font:400 12px var(--mono)}
td.player{font-weight:700}
td.set{color:#cfd6dd;max-width:380px;overflow:hidden;text-overflow:ellipsis}
td.sportcell{box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);background:var(--c);color:var(--t,#12161c);font:700 12px var(--sans);border-top-color:transparent;border-bottom-color:transparent;min-width:150px}
td.sportcell .ic{margin-left:2px;font-size:14px;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 16px}
.chip{box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:3px;background:var(--c);color:var(--t,#12161c);font:700 11px var(--sans)}
.chip b{font:700 10px var(--mono);opacity:.65}
.sp{display:inline-block;padding:3px 9px;border-radius:3px;font:700 11px var(--sans);color:#0b0f14;background:var(--c,transparent)}
.sp.none{color:#cfd6dd;background:transparent;border:1px solid #2a3542}
.src{font:400 11px var(--mono);color:var(--muted)}
.src.repack{color:var(--green);font-weight:700}
.st{display:inline-block;max-width:130px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;padding:3px 10px;border-radius:999px;font:700 11px var(--sans);background:color-mix(in srgb,var(--st) 16%,transparent);color:var(--st)}
.st.solid{background:var(--st);color:#12161c}
.age{font:700 12px var(--mono)} .age small{font-size:9px;color:var(--dim);margin-left:1px}
.age.warn{color:var(--amber)} .age.hot{color:var(--pink)}
input[type=checkbox]{accent-color:var(--green);width:13px;height:13px;cursor:pointer}
.empty{padding:70px 20px;text-align:center;color:var(--muted);font:400 12px var(--mono);line-height:1.8}
.empty b{display:block;color:var(--text);font:700 15px var(--sans);margin-bottom:6px}
.selbar{font:400 11px var(--mono);color:var(--muted)}
.toast button{margin-left:10px;background:var(--green-ink);color:var(--green);border:0;border-radius:999px;padding:3px 10px;font:700 10px var(--mono);cursor:pointer}
.restore{background:none;border:1px solid #2a3542;border-radius:3px;color:var(--amber);font:700 11px var(--sans);padding:3px 8px;cursor:pointer}
.r,th.r{text-align:right}
.dim{color:var(--dim)}
.grade{font:700 12px var(--mono)}
.bin{display:inline-block;padding:2px 7px;border:1px solid #2a3542;border-radius:3px;font:500 11px var(--mono);color:#cfd6dd}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--green);color:var(--green-ink);font:700 11px var(--mono);padding:9px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{pointer-events:auto}
.toast.show{opacity:1}
</style>
</head>

function keyPending(r){ r.root_key = 'pending-'+String(r.ac8_number||r.card_url||'').replace(/[^\w-]/g,''); return r; }

/* ---------- state ---------- */
const state = {
  section:'mismatch', tz:'America/Los_Angeles', auto:null, loadedAt:new Date(),
  rows:{ mismatch:[], scan:[], rescan:[], pending:[], support:[] },
  status:{},   // per section: 'loading' | 'ok' | error message
  sortS:{ key:null, dir:'asc' },
  sortP:{ key:null, dir:'asc' },
  sort:{ key:'verified_date', dir:'desc' },
  selected:new Set(),
  clicked:new Set(), showClicked:false, clickStore:'local',
  f:{ set_sport:'', card_sport:'', player:'', set_name:'', grader:'', from:'', to:'', source:'', status:'',
       p_ac8:'', p_cert:'', p_set:'', p_player:'', p_setnum:'', p_grade:'', p_hascert:'',
       s_order:'', s_name:'', s_bin:'', s_scan:'', s_mix:'' },
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').toLowerCase().trim().replace(/\s+/g,'_');
const nice = s => String(s||'').replace(/_/g,' ');

/* ---------- data ---------- */
async function load(sectionId){
  const sec = SECTIONS.find(s=>s.id===sectionId);
  if(!sec || !sec.questionId) return;
  if(!state.rows[sectionId].length) state.status[sectionId]='loading';
  try{
    const r = await fetch(`/api/metabase?q=${sec.questionId}`);
    let data; try{ data = await r.json(); }catch(e){ throw new Error(r.ok ? 'bad JSON from /api/metabase' : 'HTTP '+r.status+' — is api/metabase.js deployed?'); }
    if(!r.ok) throw new Error(data.error || ('HTTP '+r.status));
    state.rows[sectionId] = (Array.isArray(data)?data:data.rows||[]).map(o=>{
      const x={}; for(const k in o) x[k.toLowerCase()]=o[k];
      if(x.verified_date) x.verified_date=String(x.verified_date).slice(0,10);
      if(sectionId==='pending') keyPending(x);
      if(sectionId==='support') keySupport(x);
      return x;
    });
    state.status[sectionId]='ok';
  }catch(e){ console.error('Metabase load failed', sec.questionId, e); state.status[sectionId]=String(e.message||e); if(state.rows[sectionId].length) toast(`Q${sec.questionId}: refresh failed — showing last loaded data`); }
}
async function refresh(){
  $('#spin').classList.add('go');
  await Promise.all([...SECTIONS.map(s=>load(s.id)), loadClicked()]);
  state.loadedAt = new Date();
  setTimeout(()=>{ $('#spin').classList.remove('go'); render(); },350);
}

/* ---------- clicked cards (hide once opened) ---------- */
const LS_KEY='pl_mismatch_clicked';
function lsGet(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||'[]'); }catch(e){ return []; } }
function lsSet(){ try{ localStorage.setItem(LS_KEY,JSON.stringify([...state.clicked])); }catch(e){} }
async function loadClicked(){
  try{
    const r=await fetch('/api/clicked'); if(!r.ok) throw 0;
    const d=await r.json(); state.clicked=new Set((d.keys||[]).map(String)); state.clickStore='shared';
  }catch(e){ state.clicked=new Set(lsGet()); state.clickStore='local'; }
}
async function markClicked(key,on=true){
  on?state.clicked.add(key):state.clicked.delete(key); state.selected.delete(key); lsSet();
  if(state.clickStore!=='shared') return;
  try{ await fetch('/api/clicked',{method:on?'POST':'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({root_key:key,section:'mismatch'})}); }
  catch(e){ toast("Couldn't save — it may reappear on refresh"); }
}
function undoToast(key,name){
  const t=$('#toast'); t.innerHTML=`Opened ${esc(name)} — removed from list <button type="button" id="undo" data-key="${esc(key)}">Undo</button>`;
  t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),6000);
}

/* ---------- helpers ---------- */
function todayISO(){ return new Intl.DateTimeFormat('en-CA',{timeZone:state.tz}).format(new Date()); }
function daysSince(iso){ if(!iso) return null; return Math.round((new Date(todayISO())-new Date(iso))/864e5); }
function fmtDate(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function sportCell(s){ const o=sportOf(s); return `<td class="sportcell" style="--c:${o.c};--t:${ink(o)}">${esc(nice(s))} <span class="ic" aria-hidden="true">${o.i}</span></td>`; }
function uniq(rows,k){ return [...new Set(rows.map(r=>r[k]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b))); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),msg.length>60?7000:2200); }

function filtered(){
  const f=state.f, has=(v,q)=>String(v||'').toLowerCase().includes(q.toLowerCase());
  let rows = state.rows.mismatch.filter(r=>
    (state.showClicked ? state.clicked.has(r.root_key) : !state.clicked.has(r.root_key)) &&
    (!f.set_sport || r.set_sport===f.set_sport) &&
    (!f.card_sport|| r.card_sport===f.card_sport) &&
    (!f.player    || has(r.player_name,f.player)) &&
    (!f.set_name  || has(r.set_name,f.set_name)) &&
    (!f.grader    || r.grader_name===f.grader) &&
    (!f.from      || (r.verified_date && r.verified_date>=f.from)) &&
    (!f.to        || (r.verified_date && r.verified_date<=f.to)) &&
    (!f.source    || r.source===f.source) &&
    (!f.status    || r.card_status===f.status));
  const {key,dir}=state.sort, m=dir==='asc'?1:-1;
  rows.sort((a,b)=>{
    let x=a[key],y=b[key];
    if(key==='age'){ x=daysSince(a.verified_date)??-1; y=daysSince(b.verified_date)??-1; return (x-y)*m; }
    return String(x??'').localeCompare(String(y??''),undefined,{numeric:true})*m;
  });
  return rows;
}

/* ---------- render ---------- */
function currentRows(){ return state.section==='pending' ? filteredPending() : state.section==='support' ? filteredSupport() : filtered(); }
function renderTabs(){
  $('#sections').innerHTML = SECTIONS.map(s=>{
    const n = state.rows[s.id].filter(r=>!state.clicked.has(r.root_key)).length;
    return `<button role="tab" aria-selected="${s.id===state.section}" data-sec="${s.id}">${esc(s.name)}<span class="ct">${n||''}</span></button>`;
  }).join('');
}
function render(){
  renderTabs();
  const time = new Intl.DateTimeFormat('en-US',{timeZone:state.tz,hour:'numeric',minute:'2-digit'}).format(state.loadedAt);
  $('#stamp').textContent = `updated ${time} ${state.tz.includes('Manila')?'PHT':'PT'}`;
  const st=state.status[state.section], sec=SECTIONS.find(s=>s.id===state.section);
  if(!state.rows[state.section].length && st && st!=='ok'){
    $('#view').innerHTML = st==='loading'
      ? `<div class="empty"><b><span class="spin go"></span>Loading ${esc(sec.name)}…</b>Pulling question ${sec.questionId} from Metabase.</div>`
      : `<div class="empty"><b>Couldn't load ${esc(sec.name)}</b>Question ${sec.questionId}: ${esc(st)}<br><br><button class="pill" id="refreshBtn2" type="button">Try again</button></div>`;
    return;
  }
  if(state.section==='mismatch') renderMismatch();
  else if(state.section==='pending') renderPending();
  else if(state.section==='support') renderSupport();
  else renderPlaceholder();
}
function filteredPending(){
  const f=state.f, has=(v,q)=>String(v||'').toLowerCase().includes(q.toLowerCase().trim());
  let rows=state.rows.pending.filter(r=>
    (state.showClicked ? state.clicked.has(r.root_key) : !state.clicked.has(r.root_key)) &&
    (!f.p_ac8    || has(r.ac8_number,f.p_ac8)) &&
    (!f.p_cert   || has(r.cert_number,f.p_cert)) &&
    (!f.p_set    || has(r.set_name,f.p_set)) &&
    (!f.p_player || has(r.player_name,f.p_player)) &&
    (!f.p_setnum || has(r.set_number,f.p_setnum)) &&
    (!f.p_grade  || String(r.grade)===f.p_grade) &&
    (!f.p_hascert || (f.p_hascert==='yes' ? !!r.cert_number : !r.cert_number)));
  const {key,dir}=state.sortP, m=dir==='asc'?1:-1;
  if(key) rows=[...rows].sort((a,b)=>{
    if(key==='grade'||key==='ac8_number') return ((parseFloat(a[key])||0)-(parseFloat(b[key])||0))*m;
    return String(a[key]??'').localeCompare(String(b[key]??''),undefined,{numeric:true})*m;
  });
  return rows;
}

const numOf = v => Number(v)||0;
function filteredSupport(){
  const f=state.f, has=(v,q)=>String(v||'').toLowerCase().includes(q.toLowerCase().trim());
  let rows=state.rows.support.filter(r=>
    (state.showClicked ? state.clicked.has(r.root_key) : !state.clicked.has(r.root_key)) &&
    (!f.s_order || has(r.order_number,f.s_order)) &&
    (!f.s_name  || has(r.full_name,f.s_name)) &&
    (!f.s_bin   || (f.s_bin==='none' ? !binsOf(r).length : binsOf(r).includes(f.s_bin))) &&
    (!f.s_scan  || (f.s_scan==='yes' ? numOf(r.pending_scan_cards)>0 : numOf(r.pending_scan_cards)===0)) &&
    (!f.s_mix   || (f.s_mix==='raw' ? numOf(r.raw)>0 && numOf(r.graded)===0 : f.s_mix==='graded' ? numOf(r.graded)>0 && numOf(r.raw)===0 : numOf(r.raw)>0 && numOf(r.graded)>0)));
  const {key,dir}=state.sortS, m=dir==='asc'?1:-1;
  const nums=['order_number','raw','graded','total_cards','pending_scan_cards'];
  if(key) rows=[...rows].sort((a,b)=> nums.includes(key) ? (numOf(a[key])-numOf(b[key]))*m
                                    : String(a[key]??'').localeCompare(String(b[key]??''),undefined,{numeric:true})*m);
  return rows;
}

function renderPlaceholder(){
  const sec=SECTIONS.find(s=>s.id===state.section);
  $('#subtitle').textContent=`Precision Labeling · card data queues · ${sec.name.toLowerCase()}`;
  $('#view').innerHTML=`<div class="empty"><b>${esc(sec.name)} isn't connected yet</b>Set its Metabase question ID in SECTIONS to load cards here.</div>`;
}
function renderMismatch(){
  $('#subtitle').textContent='Precision Labeling · card data queues · set vs card sport mismatches';
  const all=state.rows.mismatch, rows=filtered(), f=state.f;
  const openTotal=all.filter(r=>!state.clicked.has(r.root_key)).length, clickedTotal=all.filter(r=>state.clicked.has(r.root_key)).length;
  const sfmt=v=>`${nice(v)} ${sportOf(v).i}`;
  const opt=(k,label,cur,fmt=nice)=>`<option value="">All</option>`+(k.endsWith('sport')?uniq(all,k).sort(bySport):uniq(all,k)).map(v=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(fmt(v))}</option>`).join('');
  const repack=rows.filter(r=>r.source==='repack').length;
  const pairs={}; rows.forEach(r=>{const p=`${nice(r.set_sport)} ${sportOf(r.set_sport).i} → ${nice(r.card_sport)} ${sportOf(r.card_sport).i}`; pairs[p]=(pairs[p]||0)+1;});
  const top=Object.entries(pairs).sort((a,b)=>b[1]-a[1])[0];
  const today=todayISO(); const todayCt=rows.filter(r=>r.verified_date===today).length;
  const sel=[...state.selected].filter(id=>rows.some(r=>r.root_key===id));
  const cols=[['','nosort'],['url','nosort'],['set_sport','Set sport'],['card_sport','Card sport'],['player_name','Player'],['grader_name','Grader'],['verified_date','Verified'],['age','Age'],['source','Source'],['card_status','Status'],['set_name','Set name']];

  $('#view').innerHTML = `
  <div class="filters">
    <div class="f"><label for="f_set">Set sport</label><select id="f_set" data-f="set_sport">${opt('set_sport','',f.set_sport,sfmt)}</select></div>
    <div class="f"><label for="f_card">Card sport</label><select id="f_card" data-f="card_sport">${opt('card_sport','',f.card_sport,sfmt)}</select></div>
    <div class="f"><label for="f_player">Player</label><input id="f_player" data-f="player" placeholder="e.g. Jordan" value="${esc(f.player)}"></div>
    <div class="f"><label for="f_setname">Set name</label><input id="f_setname" data-f="set_name" placeholder="e.g. Topps Chrome" value="${esc(f.set_name)}"></div>
    <div class="f"><label for="f_grader">Grader</label><select id="f_grader" data-f="grader">${opt('grader_name','',f.grader,v=>v)}</select></div>
    <div class="f"><label for="f_from">Verified from</label><input id="f_from" type="date" data-f="from" value="${f.from}"></div>
    <div class="f"><label for="f_to">Verified to</label><input id="f_to" type="date" data-f="to" value="${f.to}"></div>
    <div class="f"><label for="f_src">Source</label><select id="f_src" data-f="source">${opt('source','',f.source,v=>v)}</select></div>
    <div class="f"><label for="f_st">Status</label><select id="f_st" data-f="status">${opt('card_status','',f.status,titleCase)}</select></div>
    <div class="f actions"><button class="pill" id="clear" type="button">Clear filters</button></div>
  </div>

  <div class="legend">${[...new Set(all.flatMap(r=>[r.set_sport,r.card_sport]).map(sportKey).filter(Boolean))].sort(bySport).map(k=>{
      const o=SPORTS[k], n=rows.filter(r=>sportKey(r.set_sport)===k||sportKey(r.card_sport)===k).length;
      return `<span class="chip" style="--c:${o.c};--t:${ink(o)}">${esc(nice(k))} <span aria-hidden="true">${o.i}</span><b>${n}</b></span>`;}).join('')}</div>

  <div class="kpis">
    <div class="k"><div class="l">${state.showClicked?'Opened':'Open mismatches'}</div><div class="v">${rows.length.toLocaleString()}</div><div class="s">${state.showClicked?'already opened':(rows.length===openTotal?'open':'of '+openTotal.toLocaleString()+' open · filtered')}</div></div>
    <div class="k"><div class="l">Verified today</div><div class="v">${todayCt}</div><div class="s">${fmtDate(today)}</div></div>
    <div class="k"><div class="l">Repack / Non-repack</div><div class="v"><span style="color:var(--green)">${repack}</span> <span class="dim">/</span> <span style="color:var(--muted)">${rows.length-repack}</span></div><div class="s">cards</div></div>
    <div class="k"><div class="l">Top pair</div><div class="v small">${top?esc(top[0]):'—'}</div><div class="s">${top?top[1]+' cards':'no cards'}</div></div>
  </div>

  <div class="bar" style="border:0;padding:14px 0 0">
    <span class="selbar">${sel.length} selected</span>
    <button class="pill" id="copyUrls" type="button" ${sel.length?'':'disabled'}>Copy URLs</button>
    <button class="pill" id="csv" type="button" ${rows.length?'':'disabled'}>Export CSV</button>
    <button class="pill ${state.showClicked?'on':''}" id="showClicked" type="button">${state.showClicked?'Back to open cards':'Opened ('+clickedTotal+')'}</button>
    <span class="selbar" title="${state.clickStore==='shared'?'Saved for everyone':'Saved in this browser only'}">${state.clickStore==='shared'?'● shared with team':'○ this browser only'}</span>
  </div>

  <div class="tablewrap">
  ${rows.length?`<table>
    <thead><tr>${cols.map(([k,l])=>{
      if(k==='') return `<th class="nosort"><input type="checkbox" id="selAll" aria-label="Select all" ${sel.length&&sel.length===rows.length?'checked':''}></th>`;
      if(k==='url') return `<th class="nosort">URL</th>`;
      const on=state.sort.key===k; return `<th data-sort="${k}" class="${on?'sorted':''}">${l}<span class="arr">${on?(state.sort.dir==='asc'?'▲':'▼'):'↕'}</span></th>`;
    }).join('')}</tr></thead>
    <tbody>${rows.map(r=>{
      const so=statusOf(r.card_status), sc=so.c, d=daysSince(r.verified_date);
      return `<tr style="--st:${sc}">
        <td><input type="checkbox" data-id="${esc(r.root_key)}" aria-label="Select card ${esc(r.root_key)}" ${state.selected.has(r.root_key)?'checked':''}></td>
        <td class="link">${state.showClicked
          ? `<button type="button" class="restore" data-restore="${esc(r.root_key)}">Put back</button>`
          : `<a href="${esc(r.url)}" target="_blank" rel="noopener" data-open="${esc(r.root_key)}" data-name="${esc(r.player_name)}">Click Me</a>`}</td>
        ${sportCell(r.set_sport)}
        ${sportCell(r.card_sport)}
        <td class="player">${esc(r.player_name)}</td>
        <td>${esc(r.grader_name||'—')}</td>
        <td class="num">${fmtDate(r.verified_date)}</td>
        <td><span class="age ${d>=30?'hot':d>=7?'warn':''}">${d??'—'}<small>d</small></span></td>
        <td><span class="src ${r.source==='repack'?'repack':''}">${esc(r.source)}</span></td>
        <td><span class="st${so.solid?' solid':''}" title="${esc(titleCase(r.card_status))}">${esc(titleCase(r.card_status))}</span></td>
        <td class="set" title="${esc(r.set_name)}">${esc(r.set_name)}</td>
      </tr>`;}).join('')}</tbody>
  </table>`:`<div class="empty"><b>No cards match these filters</b>Clear a filter or widen the verified date range.</div>`}
  </div>`;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('a[data-open]');
  if(a){ e.preventDefault(); window.open(a.href,'_blank','noopener'); const k=a.dataset.open; markClicked(k); render(); undoToast(k,a.dataset.name||'card'); return; }
  const u=e.target.closest('#undo');
  if(u){ markClicked(u.dataset.key,false); $('#toast').classList.remove('show'); render(); return; }
  const rb=e.target.closest('[data-restore]');
  if(rb){ markClicked(rb.dataset.restore,false); render(); toast('Put back in the open list'); return; }
  if(e.target.closest('#showClicked')){ state.showClicked=!state.showClicked; state.selected.clear(); render(); return; }
  const t=e.target.closest('[data-sec],[data-sort],#clear,#copyUrls,#csv,#tz,#autoBtn,#refreshBtn,#refreshBtn2,#enterBtn');
  if(!t) return;
  if(t.dataset.sec){ state.section=t.dataset.sec; state.selected.clear(); load(state.section).then(render); render(); }
  else if(t.dataset.sort){ const k=t.dataset.sort, sk={pending:'sortP',support:'sortS'}[state.section]||'sort', cur=state[sk]; state[sk] = cur.key===k?{key:k,dir:cur.dir==='asc'?'desc':'asc'}:{key:k,dir:['verified_date','age','grade','raw','graded','total_cards','pending_scan_cards'].includes(k)?'desc':'asc'}; render(); }
  else if(t.id==='clear'){ const pre={pending:'p_',support:'s_'}[state.section]; for(const k in state.f) if(pre ? k.startsWith(pre) : !/^[ps]_/.test(k)) state.f[k]=''; render(); }
  else if(t.id==='copyUrls'){ const urls=currentRows().filter(r=>state.selected.has(r.root_key)).map(r=>r.url||r.card_url).join('\n'); navigator.clipboard?.writeText(urls).then(()=>toast('Copied '+urls.split('\n').length+' URLs'),()=>toast('Copy failed — clipboard blocked')); }
  else if(t.id==='csv'){ exportCsv(); }
  else if(t.id==='tz'){ const m=state.tz==='America/Los_Angeles'; state.tz=m?'Asia/Manila':'America/Los_Angeles'; $('#tz').classList.toggle('manila',m); $('#tzFlag').textContent=m?'🇵🇭':'🇺🇸'; $('#tzLabel').textContent=m?'MANILA':'PACIFIC'; render(); }
  else if(t.id==='autoBtn'){ if(state.auto){clearInterval(state.auto);state.auto=null;t.classList.remove('on');} else {state.auto=setInterval(refresh,60000);t.classList.add('on');toast('Auto refresh every 60s');} }
  else if(t.id==='refreshBtn'||t.id==='refreshBtn2'){ refresh(); }
  else if(t.id==='enterBtn'){ refresh(); }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='selAll'){ currentRows().forEach(r=>t.checked?state.selected.add(r.root_key):state.selected.delete(r.root_key)); render(); return; }
  if(t.dataset.id){ t.checked?state.selected.add(t.dataset.id):state.selected.delete(t.dataset.id); render(); return; }
  if(t.dataset.f && t.tagName!=='INPUT' || t.type==='date'){ state.f[t.dataset.f]=t.value; render(); }
});
document.addEventListener('auxclick',e=>{ const a=e.target.closest('a[data-open]'); if(a&&e.button===1){ markClicked(a.dataset.open); setTimeout(render,0); } });
let deb;
document.addEventListener('input',e=>{
  const t=e.target; if(!t.dataset.f||t.tagName!=='INPUT'||t.type==='date') return;
  clearTimeout(deb); deb=setTimeout(()=>{ state.f[t.dataset.f]=t.value; const id=t.id,pos=t.selectionStart; render(); const n=document.getElementById(id); n.focus(); n.setSelectionRange(pos,pos); },200);
});
function exportCsv(){
  const pend=state.section==='pending', sup=state.section==='support', rows=currentRows(),
    keys=sup?['url','order_number','status','full_name','raw','graded','total_cards','bins','pending_scan_cards']:pend?['card_url','card_status','ac8_number','cert_number','set_name','player_name','set_number','grade']
             :['url','set_sport','card_sport','player_name','grader_name','verified_date','source','card_status','set_name','root_key'];
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const csv=[keys.join(','),...rows.map(r=>keys.map(k=>q(r[k])).join(','))].join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=`${sup?'customer-support':pend?'pending-data-issue':'mismatch-set'}-${todayISO()}.csv`; a.click();
}

state.clicked=new Set(lsGet()); SECTIONS.forEach(s=>state.status[s.id]='loading'); render();
Promise.all([...SECTIONS.map(s=>load(s.id)),loadClicked()]).then(()=>{ state.loadedAt=new Date(); render(); });
</script>
